<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Glassmorphic Buttons</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="glass-panel">
      
      <button class="liquid-btn sleep-btn active" data-color="blue" data-theme="light">
        <div class="liquid-bg"></div>
        <div class="btn-content">
          <i class="fa-solid fa-bed icon"></i>
          <span class="text">Sleep</span>
          <i class="fa-solid fa-ellipsis dots"></i>
        </div>
      </button>

      <button class="liquid-btn dnd-btn" data-color="red" data-theme="dark">
        <div class="liquid-bg"></div>
        <div class="btn-content">
          <i class="fa-solid fa-moon icon"></i>
          <span class="text">Do Not Disturb</span>
          <i class="fa-solid fa-ellipsis dots"></i>
        </div>
      </button>

      <button class="liquid-btn personal-btn" data-color="orange" data-theme="light">
        <div class="liquid-bg"></div>
        <div class="btn-content">
          <i class="fa-solid fa-user icon"></i>
          <span class="text">Personal</span>
          <i class="fa-solid fa-ellipsis dots"></i>
        </div>
      </button>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
